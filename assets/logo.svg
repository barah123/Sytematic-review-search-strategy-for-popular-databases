<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2A4A"/>
      <stop offset="100%" stop-color="#15406E"/>
    </linearGradient>
    <linearGradient id="band1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#154360"/>
      <stop offset="100%" stop-color="#1B4F72"/>
    </linearGradient>
    <linearGradient id="band2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B4F72"/>
      <stop offset="100%" stop-color="#1F618D"/>
    </linearGradient>
    <linearGradient id="band3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F618D"/>
      <stop offset="100%" stop-color="#2980B9"/>
    </linearGradient>
    <linearGradient id="band4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2980B9"/>
      <stop offset="100%" stop-color="#3498DB"/>
    </linearGradient>
    <linearGradient id="band5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3498DB"/>
      <stop offset="100%" stop-color="#4FA8DE"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#06142A" flood-opacity="0.4"/>
    </filter>
  </defs>

  <circle cx="120" cy="120" r="116" fill="url(#bg)"/>
  <circle cx="120" cy="120" r="116" fill="none" stroke="#4FC3E0" stroke-width="2" opacity="0.5"/>

  <!-- five named database layers, the "background" the search icon sits over -->
  <g font-family="Helvetica, Arial, sans-serif" font-weight="700" filter="url(#soft)">
    <g>
      <rect x="50" y="100" width="140" height="19" rx="5" fill="url(#band1)"/>
      <text x="120" y="113.5" font-size="11.5" fill="#FFFFFF" text-anchor="middle">PubMed</text>
    </g>
    <g>
      <rect x="50" y="122.5" width="140" height="19" rx="5" fill="url(#band2)"/>
      <text x="120" y="136" font-size="11.5" fill="#FFFFFF" text-anchor="middle">Scopus</text>
    </g>
    <g>
      <rect x="50" y="145" width="140" height="19" rx="5" fill="url(#band3)"/>
      <text x="120" y="158.5" font-size="11.5" fill="#FFFFFF" text-anchor="middle">Web of Science</text>
    </g>
    <g>
      <rect x="50" y="167.5" width="140" height="19" rx="5" fill="url(#band4)"/>
      <text x="120" y="181" font-size="11.5" fill="#FFFFFF" text-anchor="middle">CINAHL</text>
    </g>
    <g>
      <rect x="50" y="190" width="140" height="19" rx="5" fill="url(#band5)"/>
      <text x="120" y="203.5" font-size="11.5" fill="#FFFFFF" text-anchor="middle">Cochrane CENTRAL</text>
    </g>
  </g>

  <!-- magnifying glass, search, sitting above the five database layers -->
  <g filter="url(#soft)">
    <circle cx="112" cy="66" r="25" fill="none" stroke="#F2B134" stroke-width="8"/>
    <circle cx="112" cy="66" r="25" fill="#0F2A4A" opacity="0.2"/>
    <line x1="131" y1="85" x2="152" y2="106" stroke="#F2B134" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- small checkmark inside the lens, standing for a completed/verified search -->
  <path d="M 100 66 L 109 75 L 126 56" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
